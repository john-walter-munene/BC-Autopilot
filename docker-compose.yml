version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alchemy365-agent
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/alchemy365?schema=public
      - REDIS_URL=redis://redis:6379
      - BC_WEB_URL=https://businesscentral.dynamics.com/sandbox
      - BC_ENVIRONMENT=Sandbox
      - BC_COMPANY_ID=1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
      - AZURE_TENANT_ID=72f988bf-86f1-41af-91ab-2d7cd011db47
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alchemy365-worker
    command: npx tsx src/modules/jobs/worker.ts
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/alchemy365?schema=public
      - REDIS_URL=redis://redis:6379
      - BC_WEB_URL=https://businesscentral.dynamics.com/sandbox
      - BC_ENVIRONMENT=Sandbox
      - AZURE_TENANT_ID=72f988bf-86f1-41af-91ab-2d7cd011db47
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: alchemy365-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alchemy365
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: alchemy365-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
