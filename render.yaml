services:
  - type: web
    name: bc-agent-api
    env: node
    plan: standard
    buildCommand: npm ci && npm run build
    startCommand: npm run start -w @bc-agent/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
